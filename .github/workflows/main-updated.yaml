name: main branch updated

on:
  push:
    branches:
      - main

jobs:
  bump-version:
    if: "!startsWith(github.event.head_commit.message, 'bump:')"
    runs-on: ubuntu-latest
    name: "Bump version and create changelog with commitizen"
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create bump and changelog
        id: cz
        uses: commitizen-tools/commitizen-action@0.27.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          push: false

      - name: Push bump branch
        if: steps.cz.outputs.version != ''
        run: |
          git checkout -b ci/bump-${{ steps.cz.outputs.version }}
          git push origin ci/bump-${{ steps.cz.outputs.version }}

      - name: Open PR for bump commit
        if: steps.cz.outputs.version != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const version = '${{ steps.cz.outputs.version }}';
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `bump: release ${version}`,
              body: `Automated version bump to ${version} generated by commitizen.\n\nMerging this PR keeps \`pyproject.toml\`, \`docs/conf.py\`, and \`CHANGELOG.md\` in sync with the version tag on main.`,
              head: `ci/bump-${version}`,
              base: 'main',
            });
            console.log(`Created PR #${pr.number}: ${pr.html_url}`);

      - name: Push version tag
        if: steps.cz.outputs.version != ''
        run: git push origin refs/tags/${{ steps.cz.outputs.version }}

  publish-github-page:
    name: "Build and publish Sphinx docs to GitHub Pages"
    if: "!startsWith(github.event.head_commit.message, 'bump:')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --with dev

      - name: Generate API docs
        run: poetry run sphinx-apidoc -f -e -o docs/api src/ncaa_eval

      - name: Build docs
        run: poetry run sphinx-build -b html docs docs/_build/html

      - name: Push documentation to Github Page
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./docs/_build/html
